version: '3.9'

services:
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - ${AURA_DIR:-./documents}/.aura/chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

  aura:
    image: wedigcode/aura:latest
    container_name: aura
    build: .
    depends_on:
      - chromadb
    volumes:
      - ${AURA_DIR:-./documents}:/usr/src/app/documents # Mounts the target directory containing user files
    environment:
      # Use host.docker.internal to reach the ChromaDB exposed on localhost
      # (Note: On Linux, you might need --add-host=host.docker.internal:host-gateway)
      - CHROMA_URL=http://chromadb:8000 
    env_file:
      - .env # Loads OLLAMA_HOST
    restart: unless-stopped
